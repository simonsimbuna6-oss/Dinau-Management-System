<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dinau Management System - Top Town Lae</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>body{background:#f3f4f6}</style>
</head>
<body class="p-2 max-w-2xl mx-auto">
<div class="bg-white rounded-2xl p-4 shadow mb-4">
<h1 class="font-bold text-xl">📍 Dinau Management System - Top Town Lae</h1>
<p class="text-sm text-gray-500">Any amount K0.01 (1 toea) to K1,000,000</p>
</div>

<div id="setupCard" class="bg-yellow-50 border-2 border-yellow-300 rounded-xl p-4 mb-4">
<h2 class="font-bold">⚙️ Setup</h2>
<input id="supaUrl" placeholder="https://xxxxx.supabase.co" class="w-full mt-2 p-3 border rounded-lg text-sm"/>
<input id="supaKey" placeholder="anon key eyJ..." class="w-full mt-2 p-3 border rounded-lg text-sm"/>
<button onclick="saveSetup()" class="w-full mt-3 bg-blue-600 text-white py-3 rounded-lg font-bold">Save & Load</button>
<p id="setupStatus" class="text-sm text-center mt-2"></p>
</div>

<div class="grid grid-cols-2 gap-3 mb-4">
<div class="bg-white rounded-xl p-4 shadow"><p class="text-sm text-gray-500">Total Customers</p><p id="totalCust" class="text-3xl font-bold">0</p></div>
<div class="bg-white rounded-xl p-4 shadow"><p class="text-sm text-gray-500">Total Outstanding</p><p id="totalOut" class="text-xl font-bold text-red-600">K 0.00</p></div>
</div>

<div class="flex gap-2 mb-4">
<input id="searchBox" oninput="filterCustomers()" placeholder="Search..." class="flex-1 p-3 bg-white rounded-full shadow border"/>
<button onclick="openAddCustomer()" class="bg-green-600 text-white px-5 rounded-full font-bold">+ Customer</button>
</div>

<div id="customerList" class="space-y-3"></div>

<div id="addCustomerModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50" style="display:none">
<div class="bg-white rounded-2xl p-5 w-full max-w-sm">
<h2 class="font-bold text-lg mb-3">Add Customer</h2>
<input id="custName" placeholder="Name" class="w-full p-3 border rounded-lg mb-2"/>
<input id="custPhone" placeholder="Phone" class="w-full p-3 border rounded-lg mb-3"/>
<div class="flex gap-2"><button onclick="closeModal('addCustomerModal')" class="flex-1 py-3 bg-gray-200 rounded-lg">Cancel</button><button onclick="saveCustomer()" class="flex-1 py-3 bg-green-600 text-white rounded-lg font-bold">Save</button></div>
</div></div>

<div id="addDinauModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50" style="display:none">
<div class="bg-white rounded-2xl p-5 w-full max-w-sm">
<h2 class="font-bold">Add Dinau - Item</h2>
<p class="text-xs text-gray-500">K0.01 to K1,000,000 allowed</p>
<input id="dinauItem" placeholder="Item e.g., Rice 10kg" class="w-full p-3 border rounded-lg mt-2 mb-2"/>
<input id="dinauAmount" type="number" step="0.01" min="0.01" max="1000000" placeholder="Amount e.g., 0.01, 50, 1000000" class="w-full p-3 border rounded-lg mb-2"/>
<input id="dinauDate" type="datetime-local" class="w-full p-3 border rounded-lg mb-3"/>
<div class="flex gap-2"><button onclick="closeModal('addDinauModal')" class="flex-1 py-3 bg-gray-200 rounded-lg">Cancel</button><button onclick="saveDinau()" class="flex-1 py-3 bg-blue-600 text-white rounded-lg font-bold">Save Dinau</button></div>
</div></div>

<div id="addPaymentModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50" style="display:none">
<div class="bg-slate-800 text-white rounded-2xl p-5 w-full max-w-sm">
<h2 class="font-bold">Add Payment - Part Payment</h2>
<p class="text-xs text-gray-300">K0.01 (1 toea) to K1,000,000 - any amount</p>
<input id="payAmount" type="number" step="0.01" min="0.01" max="1000000" placeholder="e.g., 0.01, 20, 50" class="w-full p-3 bg-slate-900 border rounded-lg mt-2 mb-2 text-white"/>
<input id="payNote" placeholder="Part payment / 1 toea" class="w-full p-3 bg-slate-900 border rounded-lg mb-2 text-white"/>
<input id="payDate" type="datetime-local" class="w-full p-3 bg-slate-900 border rounded-lg mb-4 text-white"/>
<div class="flex gap-2"><button onclick="closeModal('addPaymentModal')" class="flex-1 py-3 bg-gray-600 rounded-lg">Cancel</button><button onclick="savePayment()" class="flex-1 py-3 bg-sky-400 text-black rounded-lg font-bold">Save Payment</button></div>
</div></div>

<div id="detailModal" class="fixed inset-0 bg-white hidden flex-col z-40 overflow-auto" style="display:none">
<div class="p-4 border-b flex justify-between items-center sticky top-0 bg-white">
<button onclick="closeModal('detailModal')">← Back</button>
<h2 id="detailName" class="font-bold"></h2>
<div class="flex gap-1"><button onclick="openAddDinau()" class="bg-blue-600 text-white px-3 py-1 rounded-full text-sm">+ Dinau</button><button onclick="openAddPayment()" class="bg-green-600 text-white px-3 py-1 rounded-full text-sm">+ Payment</button></div>
</div>
<div class="p-4"><p id="detailBalance" class="text-2xl font-bold text-red-600 mb-4"></p><div id="detailHistory" class="space-y-2"></div></div>
</div>

<script>
let supabaseClient=null,customers=[],transactions=[],currentCustomerId=null;
function saveSetup(){const u=document.getElementById('supaUrl').value.trim(),k=document.getElementById('supaKey').value.trim();if(!u||!k){alert('Paste both');return;}localStorage.setItem('supaUrl',u);localStorage.setItem('supaKey',k);location.reload();}
window.onload=function(){const u=localStorage.getItem('supaUrl'),k=localStorage.getItem('supaKey');if(u)document.getElementById('supaUrl').value=u;if(k)document.getElementById('supaKey').value=k;if(u&&k){supabaseClient=window.supabase.createClient(u,k);loadAll();document.getElementById('setupCard').style.display='none';}const n=new Date();n.setMinutes(n.getMinutes()-n.getTimezoneOffset());const s=n.toISOString().slice(0,16);document.getElementById('dinauDate').value=s;document.getElementById('payDate').value=s;}
async function loadAll(){try{const {data:c}=await supabaseClient.from('customers').select('*').order('created_at',{ascending:false});const {data:t}=await supabaseClient.from('dinau_transactions').select('*').order('date_time',{ascending:true});customers=c||[];transactions=t||[];renderCustomers();}catch(e){alert(e.message);}}
function getBalance(id){let b=0;transactions.filter(t=>t.customer_id===id).forEach(t=>{if(t.type==='dinau')b+=parseFloat(t.amount);else b-=parseFloat(t.amount);});return b;}
function renderCustomers(){const q=(document.getElementById('searchBox').value||'').toLowerCase();const list=document.getElementById('customerList');let total=0;list.innerHTML='';customers.filter(c=>c.name.toLowerCase().includes(q)).forEach(c=>{const bal=getBalance(c.id);total+=bal;const badge=bal<=0.001?'<span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded-full">PAID OFF ✓</span>':'<span class="bg-orange-100 text-orange-700 text-xs px-2 py-1 rounded-full">Outstanding</span>';list.innerHTML+=`<div onclick="openDetail('${c.id}')" class="bg-white rounded-2xl p-4 shadow flex justify-between cursor-pointer"><div><p class="font-bold">${c.name}</p><p class="text-sm text-gray-500">${c.phone||''}</p><p class="text-sm">Balance: <b class="${bal>0?'text-red-600':''}">K ${bal.toFixed(2)}</b></p></div><div>${badge}</div></div>`;});document.getElementById('totalCust').innerText=customers.length;document.getElementById('totalOut').innerText='K '+total.toFixed(2);}
function filterCustomers(){renderCustomers();}
function openAddCustomer(){document.getElementById('addCustomerModal').style.display='flex';}
function openAddDinau(){const n=new Date();n.setMinutes(n.getMinutes()-n.getTimezoneOffset());document.getElementById('dinauDate').value=n.toISOString().slice(0,16);document.getElementById('addDinauModal').style.display='flex';}
function openAddPayment(){const n=new Date();n.setMinutes(n.getMinutes()-n.getTimezoneOffset());document.getElementById('payDate').value=n.toISOString().slice(0,16);document.getElementById('addPaymentModal').style.display='flex';}
function closeModal(id){document.getElementById(id).style.display='none';}
async function saveCustomer(){const name=document.getElementById('custName').value.trim(),phone=document.getElementById('custPhone').value.trim();if(!name){alert('Enter name');return;}const {error}=await supabaseClient.from('customers').insert({name,phone});if(error){alert(error.message);return;}closeModal('addCustomerModal');document.getElementById('custName').value='';await loadAll();}
function openDetail(cid){currentCustomerId=cid;const c=customers.find(x=>x.id===cid);document.getElementById('detailName').innerText=c.name;const bal=getBalance(cid);document.getElementById('detailBalance').innerText='Balance: K '+bal.toFixed(2)+(bal<=0.001?' PAID OFF ✓':' OWING');const hist=document.getElementById('detailHistory');const trans=transactions.filter(x=>x.customer_id===cid);hist.innerHTML='';trans.forEach(t=>{const d=new Date(t.date_time).toLocaleString();if(t.type==='dinau')hist.innerHTML+=`<div class="border p-3 rounded-xl">📦 DINAU - ${t.item} - +K${parseFloat(t.amount).toFixed(2)}<br><small>${d}</small></div>`;else hist.innerHTML+=`<div class="border p-3 rounded-xl bg-green-50">💰 PAYMENT - ${t.note} - -K${parseFloat(t.amount).toFixed(2)}<br><small>${d}</small></div>`;});document.getElementById('detailModal').style.display='flex';}
async function saveDinau(){if(!currentCustomerId){alert('Select customer');return;}const item=document.getElementById('dinauItem').value.trim()||'Item',amount=parseFloat(document.getElementById('dinauAmount').value),dt=document.getElementById('dinauDate').value;if(isNaN(amount)||amount<0.01||amount>1000000){alert('Enter amount from K0.01 (1 toea) to K1,000,000');return;}const {error}=await supabaseClient.from('dinau_transactions').insert({customer_id:currentCustomerId,type:'dinau',amount,item,date_time:dt?new Date(dt).toISOString():new Date().toISOString()});if(error){alert(error.message);return;}closeModal('addDinauModal');document.getElementById('dinauItem').value='';document.getElementById('dinauAmount').value='';await loadAll();openDetail(currentCustomerId);}
async function savePayment(){if(!currentCustomerId){alert('Select customer');return;}const amount=parseFloat(document.getElementById('payAmount').value),note=document.getElementById('payNote').value.trim()||'Part payment',dt=document.getElementById('payDate').value;if(isNaN(amount)||amount<0.01||amount>1000000){alert('Enter amount from K0.01 (1 toea) to K1,000,000');return;}const {error}=await supabaseClient.from('dinau_transactions').insert({customer_id:currentCustomerId,type:'payment',amount,note,date_time:dt?new Date(dt).toISOString():new Date().toISOString()});if(error){alert(error.message);return;}closeModal('addPaymentModal');document.getElementById('payAmount').value='';await loadAll();openDetail(currentCustomerId);alert('Payment K'+amount.toFixed(2)+' saved!');}
</script>
</body>
</html>
